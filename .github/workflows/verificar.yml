name: Verificar

# Corre en cada PR hacia main. Si falla, el PR no se puede aprobar.
# Si el cambio solo toca documentación (docs/ y archivos .md), el job `cambios` lo detecta
# y los demás se saltan para no gastar minutos de Actions. Se saltan con `if` y no con
# `paths-ignore` porque `main` exige estos checks: un job saltado cuenta como aprobado,
# pero un workflow que ni arranca deja el check en "esperado" y bloquea la fusión.
# Si un PR mezcla documentación y código, todo corre.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cambios:
    name: Detectar si el cambio toca código
    runs-on: ubuntu-latest
    outputs:
      codigo: ${{ steps.detectar.outputs.codigo }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detectar
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Sin base conocida (rama nueva o historial no disponible) se asume que hay código.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "codigo=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE" HEAD | grep -qvE '^docs/|\.md$'; then
            echo "codigo=true" >> "$GITHUB_OUTPUT"
          else
            echo "codigo=false" >> "$GITHUB_OUTPUT"
          fi

  aplicacion:
    name: Compilación y lint de la aplicación web
    needs: cambios
    if: needs.cambios.outputs.codigo == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      # En el CI no hay base: se compila con la muestra de desarrollo (datos/ejemplos).
      - run: npm run datos:ejemplo-si-falta && npx next build

  diseno:
    name: Contraste de colores (WCAG 2.2)
    needs: cambios
    if: needs.cambios.outputs.codigo == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verificar tokens de diseño
        run: python3 scripts/tokens.py --check
      - name: Instalar herramientas de comprobación de fuentes
        run: python3 -m pip install -r scripts/requirements-fuentes.txt
      - name: Comprobar fuentes locales y caracteres del español
        run: python3 scripts/fuentes.py --check
      - name: tokens.css está al día con tokens.json
        run: |
          python3 scripts/tokens.py
          git diff --exit-code diseno/tokens.css || (echo "tokens.css no coincide con tokens.json. Corre: python3 scripts/tokens.py" && exit 1)

  seguridad:
    name: Reglas de privacidad de la base de datos (RLS)
    needs: cambios
    if: needs.cambios.outputs.codigo == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: solo-para-pruebas   # base efímera de la integración continua, sin datos reales
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar migraciones y correr pruebas de seguridad
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: solo-para-pruebas
        run: bash supabase/tests/correr_pruebas.sh

  pruebas-ts:
    name: Pruebas de TypeScript (asistente y protocolo de crisis)
    needs: cambios
    if: needs.cambios.outputs.codigo == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"   # ejecuta TypeScript sin compilar ni instalar dependencias
      - name: Pruebas de tests/
        run: node --test "tests/**/*.test.ts"

  datos:
    name: Pruebas de los scripts de datos (Python)
    needs: cambios
    if: needs.cambios.outputs.codigo == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Solo biblioteca estándar: no hay nada que instalar.
      - run: python3 -m unittest discover -s tests/datos -p "test_*.py"

  accesibilidad:
    name: Accesibilidad del portal (WCAG 2.2 AA)
    needs: cambios
    if: needs.cambios.outputs.codigo == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Instalar el navegador de las pruebas
        run: npx playwright install --with-deps chromium
      - name: Compilar y revisar cada página con axe (ADR 0021)
        run: npm run test:a11y
        env:
          # Sin claves de Supabase en la CI: las páginas en vivo leen la muestra local.
          OFERTA_LOCAL: "1"
      - name: Guardar el informe si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informe-accesibilidad
          path: playwright-report/
          retention-days: 7
